name: Build Turbo Space APK

on:
  workflow_dispatch:
  push:
    paths: ["TurboSpace.zip"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o TurboSpace.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: TurboSpace
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TurboSpace-debug
          path: TurboSpace/app/build/outputs/apk/debug/app-debug.apk
